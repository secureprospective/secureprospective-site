# SP+ T2.3 -- DNS over TLS, opportunistic. Read the honesty note before quoting
# this file in anything the advisor sees.
#
# WHAT THIS DOES: when the network's resolver speaks DNS over TLS on port 853,
# queries are encrypted and a passive observer on the hotel Wi-Fi cannot read
# which sites the advisor is visiting. Measured on a t27 guest: 5 of 5 queries
# reported "encrypted transport: yes".
#
# WHAT THIS DOES NOT DO: opportunistic mode is trivially downgraded by an ACTIVE
# attacker, who simply blocks port 853 and watches the plaintext fallback. This
# is protection against passive observation ONLY. It must never be described as
# encrypted DNS without that qualifier. DNSOverTLS=yes would close the downgrade,
# and is rejected: it turns every hotel and airport captive portal into "the
# internet is broken" in a room with nobody to call, which is the exact failure
# the day-one rule forbids.
#
# WHY THIS IS SAFE ON A CAPTIVE PORTAL, measured rather than assumed. With
# outbound TCP 853 blackholed by nftables on the guest, which is the worst case
# a portal can present:
#     853 reachable           5/5 resolved, 5/5 encrypted, 0.40s
#     853 blackholed, 1st     5/5 resolved, 0/5 encrypted, 6.61s
#     853 blackholed, 2nd     5/5 resolved, 0/5 encrypted, 0.27s
# Resolution never fails, and a plain HTTP fetch returned 200 throughout. The
# fallback verdict is cached per server, so the roughly six second penalty is
# paid once on joining a DoT-hostile network and not on every query.
#
# DNSSEC=allow-downgrade for the same reason: it validates where the upstream
# supports DNSSEC and stops asking where it does not, rather than failing the
# query. A portal's forged answers are downgraded, not rejected, so the portal
# page still loads.
#
# THE MODE OF THIS FILE IS LOAD-BEARING. systemd-resolved runs as its own user,
# not as root, so it cannot read a 0640 root-owned drop-in. A drop-in created by
# a root shell under SP+'s own UMASK 027 (T2.6) lands 0640 and is SILENTLY
# IGNORED -- the daemon keeps its old setting and nothing is logged. This was hit
# for real while measuring T2.3. The build gate asserts 0644 here, and the
# posture gate asserts the effect rather than the file.

[Resolve]
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
