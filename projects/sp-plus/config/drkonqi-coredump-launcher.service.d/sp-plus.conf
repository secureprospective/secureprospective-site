# SP+ owns the crash notification.
#
# DrKonqi's "Report to SP+" button is KDE's "Report to %1" with the distro name
# substituted; DrKonqi files to bugs.kde.org and offers no hook to change that,
# so the button promises something it does not do. ExecStart is cleared and
# replaced rather than the unit being masked, so the socket activation, the
# sandboxing and the per-coredump lifecycle all still come from the KDE unit.
[Service]
ExecStart=
ExecStart=/usr/libexec/sp-plus/spplus-crash-notify
