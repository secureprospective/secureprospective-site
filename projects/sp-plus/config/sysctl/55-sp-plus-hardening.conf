# SP+ kernel hardening — Tier 1.
#
# Every key here is invisible to an advisor. That is the entry requirement, not
# a happy accident: doc 01 principle 1 says a control that breaks printing gets
# uninstalled, at which point it protects nothing. Anything with a perceptible
# cost is in Tier 2 and ships one at a time with its own regression pass.
#
# Ported from Secureblue's 55-hardening.conf, minus every key that collides with
# something SP+ needs. Each line says what it stops and, where it matters, what
# it would have broken if it had been set higher.

# ---------------------------------------------------------------- process
# Yama 1 = a process may only be traced by its own descendants. Not 2 or 3:
# Chromium-based browsers, and therefore Brave, ptrace their own children for
# crash handling and sandbox setup. 1 keeps that working and still stops one
# compromised application from reading another's memory.
kernel.yama.ptrace_scope = 1

# Kernel pointers are an ASLR bypass handed out for free in /proc.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# Performance counters are a side-channel and a kernel attack surface. Nothing
# in the advisor profile profiles anything.
kernel.perf_event_paranoid = 3

# The magic SysRq key is a physical-access console. SP+ already treats the lock
# screen as the boundary; this closes one way around it.
kernel.sysrq = 0

# Nothing on an advisor laptop legitimately loads a second kernel at runtime.
kernel.kexec_load_disabled = 1

# ---------------------------------------------------------------- memory
# unprivileged userfaultfd is a well-worn primitive for winning kernel races.
vm.unprivileged_userfaultfd = 0

# ---------------------------------------------------------------- bpf
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# ---------------------------------------------------------------- files
# A core dump of Brave contains client PII in plaintext. This is half of the
# control; the limits drop-in and core_pattern are the other half.
fs.suid_dumpable = 0
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# ---------------------------------------------------------------- network
# Advisors work on hotel, airport and client-office networks, which is exactly
# where these matter.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.icmp_echo_ignore_all = 0
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ---------------------------------------------------- deliberately NOT set
# kernel.io_uring_disabled = 2
#   Secureblue sets it. SP+ does not, yet. io_uring is used by parts of the
#   desktop stack and by Node, and the failure mode is a silent performance
#   cliff rather than a visible break, which is the hardest kind to attribute.
#   It belongs in Tier 2 behind a measurement, not here.
#
# net.ipv6.conf.*.use_tempaddr
#   NetworkManager owns IPv6 privacy per connection. Setting it here fights the
#   connection profile and the last writer wins, which is not a control.
#
# user.max_user_namespaces = 0
#   Brave's sandbox and Flatpak both need namespaces. Tier 3, reopens only when
#   T2.1 gives Brave an SELinux domain to grant an exception to.

# ---------------------------------------------------------------- coredumps
# This file is 55-, which sorts AFTER systemd's own /usr/lib/sysctl.d/50-coredump.conf,
# so this is the value that survives. The systemd-coredump drop-in is the other
# half; neither alone is enough.
kernel.core_pattern = |/bin/false
