[Unit]
# SP+ is an SMB client, not a Samba server. Do not inherit the RPM's smb binding.
BindsTo=

[Service]
# Keep every security and exposure control literal in ExecStart. The RPM's
# /etc/sysconfig/wsdd is allowed to set OPTIONS, but cannot disarm these flags.
ExecStart=
ExecStart=/usr/bin/wsdd --shortlog --chroot=/run/wsdd --discovery --no-host --listen 127.0.0.1:5357
