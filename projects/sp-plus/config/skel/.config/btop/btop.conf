#? SP+ defaults for btop. Copied out of /etc/skel when the advisor's account is
#? created, so the first launch is already branded and readable.
color_theme = "/usr/share/btop/themes/sp-plus.theme"
theme_background = False
truecolor = True
force_tty = False
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"
vim_keys = False
rounded_corners = True
graph_symbol = "braille"
shown_boxes = "cpu mem net proc"
update_ms = 2000
proc_sorting = "cpu lazy"
proc_reversed = False
proc_tree = False
proc_per_core = False
proc_mem_bytes = True
cpu_graph_upper = "total"
cpu_graph_lower = "total"
cpu_invert_lower = True
cpu_single_graph = False
cpu_bottom = False
show_uptime = True
check_temp = True
show_coretemp = True
temp_scale = "fahrenheit"
base_10_sizes = False
show_cpu_freq = True
clock_format = "%X"
background_update = True
disks_filter = ""
mem_graphs = True
show_swap = True
swap_disk = True
show_disks = True
only_physical = True
use_fstab = True
show_io_stat = True
io_mode = False
net_download = 100
net_upload = 100
net_auto = True
net_sync = True
show_battery = True
log_level = "WARNING"
