[General]
# SP+ defaults for flameshot. Every key here was checked with
# `flameshot config --check`, which names any setting it does not recognise.
#
# The intent is that an advisor presses Print Screen, drags a box, and the
# picture is already in their clipboard AND already saved somewhere they can
# find it. No tray icon to discover, no update nag, no welcome dialog.
# savePath is deliberately absent here. It has to be an absolute path and
# /etc/skel is copied verbatim into whatever home the wizard creates, so there
# is no value that is correct for every advisor. spplus-first-login writes the
# real one, and if that never runs flameshot simply asks where to save -- which
# is a question, not a failure.
filenamePattern=Screenshot_%F_%H-%M-%S
saveAfterCopy=true
showStartupLaunchMessage=false
disabledTrayIcon=true
checkForUpdates=false
showDesktopNotification=true
showHelp=false
drawColor=#ffd700
uiColor=#0033a0
contrastUiColor=#d4af37
contrastOpacity=170
drawThickness=3
