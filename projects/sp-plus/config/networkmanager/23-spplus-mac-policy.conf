# SP+ T2.7 -- MAC address policy. Deliberately asymmetric.
#
# Wi-Fi: a generated, per-SSID stable MAC. This is already Fedora's own default
# in /usr/lib/NetworkManager/conf.d/22-wifi-mac-addr.conf, and SP+ has shipped it
# by inheritance since day one without a single report of it breaking anything.
# It is restated here so the property belongs to SP+ and is asserted at runtime,
# rather than silently depending on an upstream default that can change under us.
# stable-ssid means the address is constant for a given network -- a hotel's
# captive portal and an office's MAC allowlist both keep working -- while the
# same laptop is not trackable across networks by its hardware address.
#
# Ethernet: PRESERVE, which means do not touch the address at all.
#
# This is the deliberate half. Secureblue documents USB Ethernet adapters
# failing to connect under MAC randomization, and doc 15 already names the dock
# as the reason USBGuard is rejected outright: an advisor's dock is how the
# keyboard, the display and the network all arrive. A broken dock is a broken
# desk, and no wired-MAC privacy gain is worth that trade.
#
# Note that "preserve" is chosen over "permanent" on purpose. Many USB Ethernet
# adapters carry no EEPROM and are assigned a random MAC by the kernel at probe
# time; they have no permanent address, so forcing "permanent" could fail to
# bring such a device up. "Preserve" cannot fail: it declines to act.
#
# The word "random" must never appear in this file. The build gate enforces it.

[connection.23-spplus-wifi-mac]
match-device=type:wifi
wifi.cloned-mac-address=stable-ssid

[connection.23-spplus-ethernet-mac]
match-device=type:ethernet
ethernet.cloned-mac-address=preserve
