# SP+ / DN-36 -- disable Wi-Fi power saving.
#
# wifi.powersave values (NetworkManager): 0=default 1=ignore 2=disable 3=enable.
# 2 means DISABLE POWER SAVING. This is the one that reads backwards; 3 would
# turn power saving ON.
#
# Measured on the Dell test machine (Intel Wireless 7260, iwlwifi), 15 ICMP
# packets from a wired host on the same LAN:
#   Dell, powersave on : 71.6 ms avg / 125.6 ms max / 31.5 ms mdev
#   wired reference    :  1.38 ms avg
# The NIC parks between beacons and buffers, which shows up to an advisor as a
# desktop that "hangs" for a second whenever they touch the network.
#
# Shipped in /usr/lib, NOT /etc: /usr is image-owned and read-only, so this
# survives `bootc upgrade`, while /etc stays free for a local override --
# NetworkManager reads /usr/lib/NetworkManager/conf.d first and lets
# /etc/NetworkManager/conf.d win.
# VERIFIED ON HARDWARE 2026-08-29 (Dell, Intel 7260):
#   powersave on  : 71.6 ms avg / 125.6 ms max / 31.5 ms mdev
#   powersave off : 18.3 ms avg /  58.6 ms max / 10.4 ms mdev
#   wired ref     :  0.94 ms avg
#
# TRAP: `systemctl reload NetworkManager` does NOT apply this. Nor does
# `nmcli device reconnect`. The value is read when NetworkManager STARTS, so it
# takes a full `systemctl restart NetworkManager` -- or, on a shipped machine,
# simply booting, which is why the image drop-in works. Checked with
# `iw dev wlp2s0 get power_save`, which reports the EFFECTIVE state;
# `nmcli connection show` reports the stored profile and said "0 (default)"
# the entire time, in both directions. Do not trust nmcli for this.
[connection]
wifi.powersave=2
