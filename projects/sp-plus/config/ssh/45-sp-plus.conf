# SP+ sshd hardening (D-1). Shipped as image content in /etc/ssh/sshd_config.d/.
#
# SP+ keeps sshd because an installed machine has to be auditable and supportable
# over a real shell; a serial console is an instrument, not an interface. What it
# does NOT keep is any way in that is not a key the machine's own owner installed.
#
# SP+ ships NO account and NO key (DN-13). Combined with the settings below, a
# freshly installed machine listens on 22 and can authenticate nobody at all until
# the person who installed it creates a user and gives that user a public key --
# through Anaconda's user spoke, ssh-copy-id, or a kickstart overlay they supply.
#
# Numbered 45- ON PURPOSE, and this is the part that is easy to get backwards.
# sshd takes the FIRST obtained value for each keyword, so an EARLIER-sorting
# drop-in WINS. Kinoite ships 40-redhat-crypto-policies.conf (an Include, which we
# must not pre-empt) and 50-redhat.conf. Sitting at 45 puts SP+ after the crypto
# policy include and before 50-redhat.conf, so these four settings cannot be lost
# to a future Fedora change to 50-redhat.conf. A 50-sp-plus.conf would sort AFTER
# 50-redhat.conf and would silently lose such a conflict. Today 50-redhat.conf
# sets none of these except KbdInteractiveAuthentication, to the same value; the
# build gate asserts the effective `sshd -T` output either way.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
