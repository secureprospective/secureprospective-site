# SP+ wallpaper overrides.
#
# Every theme offered on the Welcome "Choose the look" screen gets a
# background SP+ chose for it. For the themes SP+ ships, that choice lives in
# the theme's own contents/defaults, which is the right place for it.
#
# The stock Plasma themes are different: their packages belong to
# plasma-workspace, so an edit to their defaults inside the image would be
# reverted by the next RPM update, silently and without failing any gate. This
# file is the SP+-owned layer for those. spplus-apply-theme reads it, and its
# existing wallpaper validation and read-back apply to the result exactly as
# they do to a declared one, so a bad entry here fails the same way a bad
# entry in a defaults file would.
#
# Only look-and-feel packages SP+ does not ship belong here. A theme SP+ owns
# should name its own wallpaper in its own defaults instead.

[org.kde.breezedark.desktop]
Image=SPPlus-Still-Water

[org.kde.breeze.desktop]
Image=SPPlus-Winter-River
# Stock Breeze declares the BreezeLight colour scheme but leaves the
# Plasma desktop theme on "default", which paints a dark panel under a
# light theme. Catppuccin Latte, a light theme SP+ ships, sets
# breeze-light in its own defaults and looks right; this matches it.
PlasmaTheme=breeze-light
