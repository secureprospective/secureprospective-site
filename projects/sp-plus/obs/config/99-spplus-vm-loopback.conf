# SP+ production: play the VM's audio back to whatever the default output is.
# Without this, routing the VM to SPplusVM would make it inaudible to the operator.
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "SP+ VM monitor -> speakers"
            capture.props = {
                node.name   = "spplus_vm_loopback_in"
                target.object = "SPplusVM"
                stream.capture.sink = true
                node.passive = true
            }
            playback.props = {
                node.name  = "spplus_vm_loopback_out"
                media.class = Stream/Output/Audio
            }
        }
    }
]
