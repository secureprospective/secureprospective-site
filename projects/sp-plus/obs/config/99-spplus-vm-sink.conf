# SP+ production: a dedicated sink that carries ONLY the VM's audio.
#
# Why this exists: OBS needs the VM's sound as its own recording track so the
# voice-over can be balanced against it in post. Capturing the default sink's
# monitor instead would pick up every desktop notification too.
#
# obs-pipewire-audio-capture (per-application capture) is NOT packaged in
# Debian, so this uses a plain null sink -- all native, nothing to rebuild on
# an OBS upgrade.
#
# OBS captures  SPplusVM.monitor
# Christopher still hears the VM via the loopback in 99-spplus-vm-loopback.conf
context.modules = [
    {   name = libpipewire-module-adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "SPplusVM"
            node.description = "SP+ VM audio (OBS capture)"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            audio.rate       = 48000
            monitor.channel-volumes = true
            node.virtual     = false
        }
    }
]
